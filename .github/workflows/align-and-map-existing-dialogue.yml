name: Align existing character dialogue and map Chinese source utterances

on:
  workflow_dispatch:
    inputs:
      analysis_run_id:
        description: "Successful analysis workflow run ID whose artifact contains the ten Arabic transcripts"
        required: true
        type: string
        default: "40970048521"
      checkpoint_run_id:
        description: "Optional previous alignment run ID containing a resumable semantic mapping checkpoint"
        required: false
        type: string
        default: ""
  workflow_run:
    workflows:
      - Analyze episode dialogue and existing Arabic voice tracks
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: episode-dialogue-alignment
  cancel-in-progress: false

jobs:
  align:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Checkout the Arabic dialogue script
        uses: actions/checkout@v4
        with:
          repository: h776117073-eng/MPC
          ref: main
          path: mpc
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download completed analysis artifact
        uses: actions/download-artifact@v4
        with:
          name: episode-existing-voice-analysis-${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.analysis_run_id }}
          path: work
          run-id: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.analysis_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download prior semantic mapping checkpoint when provided
        if: github.event_name == 'workflow_dispatch' && inputs.checkpoint_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: episode-dialogue-alignment-checkpoint-${{ inputs.checkpoint_run_id }}
          path: work/checkpoint
          run-id: ${{ inputs.checkpoint_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore resumable semantic mapping state
        if: github.event_name == 'workflow_dispatch' && inputs.checkpoint_run_id != ''
        run: |
          if [ -s work/checkpoint/source_to_arabic_lines.json.partial.json ]; then
            cp work/checkpoint/source_to_arabic_lines.json.partial.json work/analysis/source_to_arabic_lines.json.partial.json
          fi
      - name: Verify the source and ten Arabic transcript checkpoints
        run: |
          set -euo pipefail
          test -s work/analysis/source_speakers.json
          test -s work/analysis/speaker_scripts.json
          test -d work/analysis/voice_tracks
          test "$(find work/analysis/voice_tracks -maxdepth 1 -type f -name '*.json' | wc -l)" -eq 10
      - name: Align Arabic WAV master words to each written utterance
        run: |
          set -euo pipefail
          python scripts/align_dub_lines.py \
            --speakers-json mpc/data/speakers.json \
            --voice-asr-dir work/analysis/voice_tracks \
            --out work/analysis/voice_line_timing.json
      - name: Semantically map Chinese source dialogue to Arabic line IDs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
        run: |
          set -euo pipefail
          python scripts/map_chinese_dialogue_to_arabic_script.py \
            --source-speakers work/analysis/source_speakers.json \
            --speaker-scripts work/analysis/speaker_scripts.json \
            --out work/analysis/source_to_arabic_lines.json \
            --model gemini-3.6-flash \
            --batch-size 6 \
            --max-output-tokens 8192
      - name: Preserve resumable alignment checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: episode-dialogue-alignment-checkpoint-${{ github.run_id }}
          path: |
            work/analysis/voice_line_timing.json
            work/analysis/source_to_arabic_lines.json.partial.json
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6
      - name: Upload alignment and semantic mapping reports
        uses: actions/upload-artifact@v4
        with:
          name: episode-dialogue-alignment-${{ github.run_id }}
          path: |
            work/analysis/voice_line_timing.json
            work/analysis/source_to_arabic_lines.json
            work/analysis/analysis_manifest.json
            work/analysis/source_speakers.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

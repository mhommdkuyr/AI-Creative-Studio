name: Analyze episode dialogue and existing Arabic voice tracks

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "Google Drive source episode"
        required: true
        type: string
        default: "https://drive.google.com/file/d/13AL8R54GE-S41TsIbXGX1rhIa-Y0HZm-/view?usp=drivesdk"
      asr_model:
        description: "Multilingual Whisper model"
        required: true
        type: choice
        options: ["base","small"]
        default: "small"

permissions:
  contents: read

concurrency:
  group: episode-existing-voice-analysis
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Checkout Arabic dialogue scripts
        uses: actions/checkout@v4
        with:
          repository: h776117073-eng/MPC
          ref: main
          path: mpc
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install media tools and ASR / diarization libraries
        run: |
          set -euo pipefail
          command -v ffmpeg >/dev/null || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          python -m pip install --upgrade pip
          python -m pip install "numpy<2" soundfile faster-whisper "speechbrain>=1.0.3" "scikit-learn>=1.4" gdown
      - name: Restore model and transcript checkpoints
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/huggingface/hub/
            ~/.cache/torch/
            work/analysis/
          key: episode-existing-voices-${{ inputs.asr_model }}-${{ hashFiles('scripts/analyze_existing_dub_tracks.py','mpc/data/speakers.json') }}-${{ github.run_id }}
          restore-keys: |
            episode-existing-voices-${{ inputs.asr_model }}-${{ hashFiles('scripts/analyze_existing_dub_tracks.py','mpc/data/speakers.json') }}-
      - name: Download source episode and all ten Arabic voice masters
        env:
          SOURCE_URL: ${{ inputs.source_url }}
        run: |
          set -euo pipefail
          mkdir -p work/source work/voices work/analysis
          gdown "$SOURCE_URL" --output work/source/episode.mkv --continue
          test -s work/source/episode.mkv
          gdown "1mrtadf_yTJtk9vv2OIEqCSyhi-O_VJjA" --output work/voices/01_لي_يانغ_Leda.wav --continue
          gdown "1n-E4VaPurnlbvaT5V_5taMXNHaGC8Ipl" --output work/voices/02_لو_مينغ_Achird.wav --continue
          gdown "10cFLVZkb79xhYlBIYatBn_6s2hOjc4Os" --output work/voices/03_تشوانغ_شيان_يوي_Kore.wav --continue
          gdown "1ZGttKXDYt6lzCtcCYU_2qr84ZgPXHDJq" --output work/voices/04_فو_شاوتشينغ_Puck.wav --continue
          gdown "11HSnZ57lpUBlvztteIXF58FLydtJOD_J" --output work/voices/05_شيا_مو_يان_Zephyr.wav --continue
          gdown "1kW388RgJNpoVCFEE8HRU18x4sX250bBf" --output work/voices/remaining_06_10.zip --continue
          mkdir -p work/voices/extracted
          unzip -oq work/voices/remaining_06_10.zip -d work/voices/extracted
          find work/voices/extracted -type f -name '*.wav' -exec cp -f {} work/voices/ \;
          for f in work/voices/*.wav; do test -s "$f"; done
          test "$(find work/voices -maxdepth 1 -type f -name '*.wav' | wc -l)" -eq 10
          echo "Source bytes: $(stat -c%s work/source/episode.mkv)"
          echo "Arabic voice WAV tracks: 10"
      - name: Extract normalized Chinese source audio
        run: |
          set -euo pipefail
          ffmpeg -y -v error -i work/source/episode.mkv -map 0:a:0 -vn -ac 1 -ar 16000 -c:a pcm_s16le work/source/chinese_source_16k.wav
          test -s work/source/chinese_source_16k.wav
          ffprobe -v error -show_entries format=duration,size -of json work/source/chinese_source_16k.wav > work/source/source_audio_probe.json
      - name: Transcribe and diarize source plus existing Arabic voice tracks
        env:
          ASR_MODEL: ${{ inputs.asr_model }}
        run: |
          set -euo pipefail
          python scripts/analyze_existing_dub_tracks.py             --source-audio work/source/chinese_source_16k.wav             --voice-dir work/voices             --speakers-json mpc/data/speakers.json             --out-dir work/analysis             --model "$ASR_MODEL"             --max-speakers 14
      - name: Save checkpoints
        if: always() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/huggingface/hub/
            ~/.cache/torch/
            work/analysis/
          key: episode-existing-voices-${{ inputs.asr_model }}-${{ hashFiles('scripts/analyze_existing_dub_tracks.py','mpc/data/speakers.json') }}-${{ github.run_id }}
      - name: Upload analysis package and speaker audio transcripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: episode-existing-voice-analysis-${{ github.run_id }}
          path: |
            work/analysis/
            work/source/source_audio_probe.json
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6

name: cloudflare-edge-ci

on:
  push:
    branches: [browser-first-cloudflare-foundation, main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run build:apps
      - name: Wrangler dry run
        run: npx --yes wrangler deploy --config cloudflare/wrangler.jsonc --dry-run
